<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday Console — FC Pro Club Tournament Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1512;
    --panel:#141C18;
    --panel-2:#182019;
    --turf:#1B4332;
    --turf-light:#2D6A4F;
    --chalk:#EDEAE0;
    --chalk-dim:#A7ADA4;
    --amber:#FFB703;
    --red:#E63946;
    --blue:#4CC9F0;
    --line:rgba(237,234,224,0.10);
    --line-strong:rgba(237,234,224,0.20);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;}
  h1,h2,h3,.eyebrow,.nav-item,.stat-label,button,.tab{font-family:'Oswald',sans-serif;letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--blue);}

  /* Layout */
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
  @media (max-width:820px){.app{grid-template-columns:1fr;}}

  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  @media (max-width:820px){.sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line);}}
  .brand{padding:0 18px 18px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .brand .mark{display:flex;align-items:center;gap:8px;}
  .brand .dot{width:10px;height:10px;background:var(--amber);border-radius:2px;transform:rotate(45deg);}
  .brand h1{font-size:16px;margin:0;text-transform:uppercase;color:var(--chalk);}
  .brand p{margin:4px 0 0;font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.08em;}

  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--chalk-dim);cursor:pointer;font-size:13px;text-transform:uppercase;border-left:3px solid transparent;}
  .nav-item .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--turf-light);width:16px;}
  .nav-item:hover{color:var(--chalk);background:rgba(255,255,255,0.02);}
  .nav-item.active{color:var(--chalk);border-left-color:var(--amber);background:rgba(255,183,3,0.06);}
  .nav-item.active .n{color:var(--amber);}

  .main{padding:26px 32px 60px;max-width:1180px;}
  @media (max-width:820px){.main{padding:20px 16px 50px;}}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .eyebrow{font-size:11px;color:var(--turf-light);text-transform:uppercase;letter-spacing:.12em;margin:0 0 4px;}
  .page-title{font-size:26px;margin:0;color:var(--chalk);text-transform:uppercase;}
  .page-sub{color:var(--chalk-dim);font-size:13px;margin-top:6px;max-width:560px;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:6px 10px;border:1px solid var(--line-strong);border-radius:3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px;}
  .chip .led{width:7px;height:7px;border-radius:50%;background:var(--chalk-dim);}
  .chip.on .led{background:#57CC99;box-shadow:0 0 6px #57CC99;}
  .chip.off .led{background:var(--red);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:16px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .card-head h3{margin:0;font-size:14px;text-transform:uppercase;color:var(--chalk);letter-spacing:.03em;}
  .card-head h3 .sec{color:var(--turf-light);margin-right:8px;}

  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:820px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  .stat{border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:var(--panel-2);}
  .stat-label{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.1em;}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--chalk);margin-top:4px;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.red{color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);padding:8px 10px;border-bottom:1px solid var(--line-strong);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--chalk-dim);font-style:italic;text-align:center;padding:22px;}

  label{display:block;font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;margin-top:10px;}
  input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line-strong);color:var(--chalk);padding:9px 10px;border-radius:4px;font-family:'Inter',sans-serif;font-size:13px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--turf-light);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>div{flex:1;min-width:140px;}

  button{cursor:pointer;border:none;border-radius:4px;padding:9px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:var(--turf-light);color:var(--chalk);transition:filter .12s;}
  button:hover{filter:brightness(1.15);}
  button.secondary{background:transparent;border:1px solid var(--line-strong);}
  button.danger{background:var(--red);}
  button.amber{background:var(--amber);color:#1a1400;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  button.small{padding:5px 9px;font-size:10.5px;}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;}
  .badge.green{background:rgba(87,204,153,.15);color:#57CC99;}
  .badge.amber{background:rgba(255,183,3,.15);color:var(--amber);}
  .badge.red{background:rgba(230,57,70,.15);color:var(--red);}
  .badge.grey{background:rgba(237,234,224,.08);color:var(--chalk-dim);}
  .badge.blue{background:rgba(76,201,240,.15);color:var(--blue);}

  .divider{height:1px;background:var(--line);margin:16px 0;}
  .note{font-size:11.5px;color:var(--chalk-dim);line-height:1.6;border-left:2px solid var(--turf-light);padding:8px 12px;background:rgba(255,255,255,.02);margin-top:10px;}
  .note.warn{border-left-color:var(--amber);}
  .note.alert{border-left-color:var(--red);}

  .rule-ref{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--turf-light);text-transform:uppercase;}

  .tabsec{display:none;}
  .tabsec.active{display:block;}

  .pill-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .pill{border:1px solid var(--line-strong);border-radius:20px;padding:4px 12px;font-size:11px;display:flex;align-items:center;gap:8px;}
  .pill .x{cursor:pointer;color:var(--red);font-weight:700;}

  .foot-note{color:var(--chalk-dim);font-size:11px;margin-top:30px;text-align:center;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-2);border:1px solid var(--line);}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="brand">
      <div class="mark"><div class="dot"></div><h1>Matchday Console</h1></div>
      <p>FC Pro Club Admin</p>
    </div>
    <div id="navList"></div>
  </nav>

  <main class="main">
    <div id="content"></div>
    <div class="foot-note">Matchday Console — data is stored in this browser only (see Settings tab).</div>
  </main>
</div>

<script>
/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'eafc_matchday_console_v1';
let PERSIST_MODE = 'local'; // 'local' or 'memory'
let MEMORY_FALLBACK = null;

function defaultState(){
  return {
    settings:{ squadCap:20, transferCapPerSeason:2, tournamentName:'FC Pro Club Circuit', season:'Season 1' },
    transferWindow:{ open:false },
    teams:[],       // {id,name,captain,vice,createdAt}
    players:[],     // {id,teamId,name,gamertag,platform,position,locked,verified,prevTeamIds:[],transfersUsed}
    transfers:[],   // {id,playerId,fromTeamId,toTeamId,type,date,note}
    fixtures:[],    // {id,home,away,date,server,status,checkinStart,pauses:{home,away},goalsScored,redCard,disconnects:[],score:{home,away},mediaProof:{pre,post,proofTime},completedAt}
    disputes:[],    // {id,fixtureId,submittedBy,description,evidence,submittedAt,status}
    violations:[]   // {id,subject,type,note,date,action}
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    PERSIST_MODE='local';
    if(raw) return JSON.parse(raw);
    return defaultState();
  }catch(e){
    PERSIST_MODE='memory';
    if(!MEMORY_FALLBACK) MEMORY_FALLBACK = defaultState();
    return MEMORY_FALLBACK;
  }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    PERSIST_MODE='local';
  }catch(e){
    PERSIST_MODE='memory';
    MEMORY_FALLBACK = STATE;
  }
}

let STATE = loadState();
function uid(){ return Math.random().toString(36).slice(2,9); }
function persist(){ saveState(); render(); }

/* ============================= NAV ============================= */
const TABS = [
  {id:'dashboard', n:'', label:'Dashboard'},
  {id:'teams', n:'1', label:'Rosters & Teams'},
  {id:'transfers', n:'2', label:'Transfer Window'},
  {id:'fixtures', n:'3', label:'Match Setup'},
  {id:'live', n:'4', label:'Live Match Control'},
  {id:'compliance', n:'5', label:'Conduct & Proof'},
  {id:'disputes', n:'', label:'Disputes'},
  {id:'standings', n:'', label:'Standings'},
  {id:'settings', n:'', label:'Settings'},
];
let ACTIVE_TAB = 'dashboard';

function renderNav(){
  const el = document.getElementById('navList');
  el.innerHTML = TABS.map(t=>`
    <div class="nav-item ${ACTIVE_TAB===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span class="n">${t.n}</span><span>${t.label}</span>
    </div>`).join('');
}
function setTab(id){ ACTIVE_TAB = id; render(); }

/* ============================= HELPERS ============================= */
function team(id){ return STATE.teams.find(t=>t.id===id); }
function teamName(id){ const t=team(id); return t? t.name : '—'; }
function playersOf(teamId){ return STATE.players.filter(p=>p.teamId===teamId); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function minutesLeft(target){ return Math.round((new Date(target)-new Date())/60000); }

/* ============================= DASHBOARD ============================= */
function viewDashboard(){
  const teamsCount = STATE.teams.length;
  const playersCount = STATE.players.length;
  const openDisputes = STATE.disputes.filter(d=>d.status==='open').length;
  const liveMatches = STATE.fixtures.filter(f=>f.status==='live').length;
  const banCount = STATE.violations.filter(v=>v.action==='Lifetime Ban').length;

  return `
    <div class="topbar">
      <div>
        <p class="eyebrow">${esc(STATE.settings.season)}</p>
        <h1 class="page-title">${esc(STATE.settings.tournamentName)}</h1>
        <p class="page-sub">Admin control room for running the tournament to the official ruleset — rosters, transfers, matchday ops, conduct and disputes, all in one place.</p>
      </div>
      <div class="chips">
        <div class="chip ${STATE.transferWindow.open?'on':'off'}"><span class="led"></span>Transfer Window ${STATE.transferWindow.open?'Open':'Closed'}</div>
        <div class="chip ${liveMatches>0?'on':'off'}"><span class="led"></span>${liveMatches} Live Match${liveMatches===1?'':'es'}</div>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="stat"><div class="stat-label">Registered Teams</div><div class="stat-value">${teamsCount}</div></div>
      <div class="stat"><div class="stat-label">Signed Players</div><div class="stat-value">${playersCount}</div></div>
      <div class="stat"><div class="stat-label">Open Disputes</div><div class="stat-value ${openDisputes>0?'amber':''}">${openDisputes}</div></div>
      <div class="stat"><div class="stat-label">Lifetime Bans</div><div class="stat-value ${banCount>0?'red':''}">${banCount}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Upcoming & Live Fixtures</h3></div>
      ${renderFixtureMini()}
    </div>

    <div class="card">
      <div class="card-head"><h3>Rulebook Quick Reference</h3></div>
      <div class="grid grid-2">
        <div class="note">§1 Rosters: 11–16+ core squad, strict 11v11, position locks enforced, squad cap ${STATE.settings.squadCap}.</div>
        <div class="note">§2 Transfers: signings only while window open; contracted, season-locked, ex-team and unverified players are blocked.</div>
        <div class="note">§3 Match Setup: Normal speed, neutral lag-free server, Clear/Day weather, no custom stadiums.</div>
        <div class="note">§4 Live Match: 15-min check-in, max 3 pauses/team (dead-ball only), disconnect &lt;10' with no goals/reds ⇒ restart.</div>
        <div class="note warn">§5 Proof: pre/post-match media required, keep 48h. Zero tolerance on fixing/toxicity ⇒ lifetime ban.</div>
        <div class="note warn">Disputes: must be filed within 2 hours of match completion with evidence.</div>
      </div>
    </div>
  `;
}
function renderFixtureMini(){
  const list = [...STATE.fixtures].filter(f=>f.status!=='completed').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6);
  if(!list.length) return `<table><tr class="empty-row"><td>No scheduled fixtures yet. Create one in Match Setup.</td></tr></table>`;
  return `<table><thead><tr><th>Fixture</th><th>Date</th><th>Status</th><th>Server</th></tr></thead><tbody>
    ${list.map(f=>`<tr><td>${esc(teamName(f.home))} vs ${esc(teamName(f.away))}</td><td class="mono">${fmtDate(f.date)}</td><td>${statusBadge(f.status)}</td><td>${esc(f.server||'—')}</td></tr>`).join('')}
  </tbody></table>`;
}
function statusBadge(s){
  const map = {scheduled:'grey',live:'amber',completed:'green',forfeit:'red'};
  return `<span class="badge ${map[s]||'grey'}">${s}</span>`;
}

/* ============================= TEAMS (§1) ============================= */
function viewTeams(){
  return `
    <div class="topbar"><div><p class="eyebrow rule-ref">§1 Team Composition &amp; Rosters</p><h1 class="page-title">Rosters &amp; Teams</h1>
    <p class="page-sub">Every club needs a Captain and Vice-Captain, a core of 11–16+ players, and locked positions before kickoff.</p></div></div>

    <div class="card">
      <div class="card-head"><h3>Register a Club</h3></div>
      <div class="row">
        <div><label>Club Name</label><input id="teamName" placeholder="e.g. Ironclad FC"></div>
        <div><label>Captain (Gamertag)</label><input id="teamCaptain" placeholder="Captain gamertag"></div>
        <div><label>Vice-Captain (Gamertag)</label><input id="teamVice" placeholder="Vice-Captain gamertag"></div>
      </div>
      <div class="btn-row"><button onclick="addTeam()">Register Club</button></div>
    </div>

    ${STATE.teams.map(t=>renderTeamCard(t)).join('') || `<div class="card"><table><tr class="empty-row"><td>No clubs registered yet.</td></tr></table></div>`}
  `;
}
function renderTeamCard(t){
  const roster = playersOf(t.id);
  const cap = STATE.settings.squadCap;
  const over = roster.length>=cap;
  const under16 = roster.length<11;
  return `
  <div class="card">
    <div class="card-head">
      <h3>${esc(t.name)} <span class="badge grey" style="margin-left:8px;">${roster.length}/${cap}</span> ${under16?'<span class="badge amber">Below min. 11</span>':''}</h3>
      <div class="btn-row" style="margin:0;"><button class="secondary small" onclick="editTeam('${t.id}')">Edit Club</button><button class="danger small" onclick="removeTeam('${t.id}')">Disband</button></div>
    </div>
    <div class="row">
      <div><span class="stat-label">Captain</span><div>${esc(t.captain||'—')}</div></div>
      <div><span class="stat-label">Vice-Captain</span><div>${esc(t.vice||'—')}</div></div>
    </div>
    <div class="divider"></div>
    <table>
      <thead><tr><th>Player</th><th>Gamertag</th><th>Platform</th><th>Position</th><th>Locked</th><th>Verified</th><th>Transfers</th><th></th></tr></thead>
      <tbody>
        ${roster.length? roster.map(p=>`
          <tr>
            <td>${esc(p.name)}</td>
            <td class="mono">${esc(p.gamertag)}</td>
            <td>${esc(p.platform)}</td>
            <td>${esc(p.position)}</td>
            <td>${p.locked?'<span class="badge green">Locked</span>':`<button class="secondary small" onclick="lockPlayer('${p.id}')">Lock</button>`}</td>
            <td>${p.verified?'<span class="badge blue">Verified</span>':`<button class="secondary small" onclick="verifyPlayer('${p.id}')">Verify</button>`}</td>
            <td class="mono">${p.transfersUsed||0}/${STATE.settings.transferCapPerSeason}</td>
            <td><button class="danger small" onclick="removePlayer('${p.id}')">Release</button></td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="8">No players signed to this roster yet.</td></tr>`}
      </tbody>
    </table>
    <div class="divider"></div>
    <div class="row" style="align-items:flex-end;">
      <div><label>Player Name</label><input id="pName-${t.id}" placeholder="Full name / IGN"></div>
      <div><label>Gamertag / ID</label><input id="pTag-${t.id}" placeholder="PSN / Xbox / PC ID"></div>
      <div><label>Platform</label><select id="pPlat-${t.id}"><option>PS5</option><option>Xbox</option><option>PC</option></select></div>
      <div><label>Position</label><select id="pPos-${t.id}">
        <option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>CDM</option><option>CM</option><option>CAM</option><option>LM</option><option>RM</option><option>LW</option><option>RW</option><option>ST</option>
      </select></div>
      <div style="flex:0 0 auto;"><button ${over?'disabled':''} onclick="addPlayer('${t.id}')">${over?'Squad Full':'Sign Player'}</button></div>
    </div>
    ${over?`<div class="note warn">Squad cap of ${cap} reached — release a player before signing another (§2 Roster Caps).</div>`:''}
  </div>`;
}
function addTeam(){
  const name=document.getElementById('teamName').value.trim();
  if(!name){alert('Club name is required.');return;}
  STATE.teams.push({id:uid(),name,captain:document.getElementById('teamCaptain').value.trim(),vice:document.getElementById('teamVice').value.trim(),createdAt:new Date().toISOString()});
  persist();
}
function editTeam(id){
  const t=team(id); if(!t) return;
  const name=prompt('Club name',t.name); if(name===null) return;
  const captain=prompt('Captain gamertag',t.captain||''); if(captain===null) return;
  const vice=prompt('Vice-Captain gamertag',t.vice||''); if(vice===null) return;
  t.name=name.trim()||t.name; t.captain=captain.trim(); t.vice=vice.trim();
  persist();
}
function removeTeam(id){
  if(!confirm('Disband this club? Its players will be released to free agency.')) return;
  STATE.players.forEach(p=>{ if(p.teamId===id){ p.teamId=null; p.locked=false; } });
  STATE.teams = STATE.teams.filter(t=>t.id!==id);
  persist();
}
function addPlayer(teamId){
  const t=team(teamId);
  if(playersOf(teamId).length>=STATE.settings.squadCap){alert('Squad cap reached.');return;}
  const name=document.getElementById(`pName-${teamId}`).value.trim();
  const gamertag=document.getElementById(`pTag-${teamId}`).value.trim();
  const platform=document.getElementById(`pPlat-${teamId}`).value;
  const position=document.getElementById(`pPos-${teamId}`).value;
  if(!name||!gamertag){alert('Player name and gamertag are required.');return;}
  const dupe = STATE.players.find(p=>p.gamertag.toLowerCase()===gamertag.toLowerCase() && p.teamId);
  if(dupe){ alert(`This gamertag is already rostered to ${teamName(dupe.teamId)}. A player can't be dual-rostered (§2 Ineligible Signings).`); return; }
  STATE.players.push({id:uid(),teamId,name,gamertag,platform,position,locked:false,verified:false,prevTeamIds:[],transfersUsed:0});
  persist();
}
function removePlayer(id){
  if(!confirm('Release this player to free agency?')) return;
  const p=STATE.players.find(x=>x.id===id);
  if(p){ if(p.teamId && !p.prevTeamIds.includes(p.teamId)) p.prevTeamIds.push(p.teamId); p.teamId=null; p.locked=false; }
  persist();
}
function lockPlayer(id){ const p=STATE.players.find(x=>x.id===id); if(p) p.locked=true; persist(); }
function verifyPlayer(id){ const p=STATE.players.find(x=>x.id===id); if(p) p.verified=true; persist(); }

/* ============================= TRANSFERS (§2) ============================= */
function viewTransfers(){
  const freeAgents = STATE.players.filter(p=>!p.teamId);
  return `
    <div class="topbar">
      <div><p class="eyebrow rule-ref">§2 Transfer Window &amp; Market</p><h1 class="page-title">Transfer Window</h1>
      <p class="page-sub">Toggle the window, sign free agents, and move contracted players between clubs. Every signing is checked against eligibility rules automatically.</p></div>
      <div class="chips"><div class="chip ${STATE.transferWindow.open?'on':'off'}"><span class="led"></span>Window ${STATE.transferWindow.open?'Open':'Closed'}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Window Control</h3>

        </select>

        <select id="trDest">
          <option value="">Select club…</option>
          ${STATE.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
        </select>
        <label><input type="checkbox" id="trEmergency" style="width:auto;display:inline-block;margin-right:6px;">Emergency replacement — admin dispensation (allows signing while window closed)</label>

        <div id="trResult"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Transfer Log</h3></div>
      <table><thead><tr><th>Date</th><th>Player</th><th>From</th><th>To</th><th>Type</th></tr></thead><tbody>
        ${STATE.transfers.length? [...STATE.transfers].reverse().map(tr=>`<tr><td class="mono">${fmtDate(tr.date)}</td><td>${esc(tr.playerName)}</td><td>${esc(tr.fromName)}</td><td>${esc(tr.toName)}</td><td>${esc(tr.type)}</td></tr>`).join(''):'<tr class="empty-row"><td colspan="5">No transfers processed yet.</td></tr>'}
      </tbody></table>

function toggleWindow(){ STATE.transferWindow.open=!STATE.transferWindow.open; persist(); }
function processTransfer(){
  const playerId=document.getElementById('trPlayer').value;
  const destId=document.getElementById('trDest').value;
  const emergency=document.getElementById('trEmergency').checked;
  const resultEl=document.getElementById('trResult');
  if(!playerId||!destId){ resultEl.innerHTML=`<div class="note alert">Select both a player and a destination club.</div>`; return; }
  const p=STATE.players.find(x=>x.id===playerId);
  const dest=team(destId);
  const reasons=[];

  if(!STATE.transferWindow.open && !emergency) reasons.push('Transfer window is closed (no emergency dispensation checked).');
  if(p.teamId===destId) reasons.push('Player is already on this club.');
  if(!p.verified) reasons.push('Gamertag is not verified on the league platform — verify in Rosters &amp; Teams first.');
  if((p.transfersUsed||0)>=STATE.settings.transferCapPerSeason) reasons.push(`Player has reached the max transfers for this season (${STATE.settings.transferCapPerSeason}).`);
  if(p.prevTeamIds && p.prevTeamIds.includes(destId)) reasons.push('Ex-team restriction: player cannot return to a former club from earlier this season.');
  if(playersOf(destId).length>=STATE.settings.squadCap) reasons.push(`Destination club is at the squad cap (${STATE.settings.squadCap}).`);

  if(reasons.length){
    resultEl.innerHTML = `<div class="note alert"><strong>Signing blocked:</strong><br>${reasons.map(r=>'• '+esc(r)).join('<br>')}</div>`;
    return;
  }

  const fromName = p.teamId? teamName(p.teamId) : 'Free Agency';
  if(p.teamId && !p.prevTeamIds.includes(p.teamId)) p.prevTeamIds.push(p.teamId);
  p.teamId=destId; p.locked=false; p.transfersUsed=(p.transfersUsed||0)+1;
  STATE.transfers.push({id:uid(),playerId,playerName:p.name,fromName,toName:dest.name,type:emergency?'Emergency Replacement':(fromName==='Free Agency'?'Free Agent Signing':'Window Transfer'),date:new Date().toISOString()});
  resultEl.innerHTML = `<div class="note">Signing approved: ${esc(p.name)} moves from ${esc(fromName)} to ${esc(dest.name)}.</div>`;
  persist();
}

function startCheckin(id){ const f=STATE.fixtures.find(x=>x.id===id); f.checkinStart=new Date().toISOString(); persist(); }
function kickoffMatch(id){ const f=STATE.fixtures.find(x=>x.id===id); f.status='live'; persist(); }
function forfeitFixture(id,side){
  const f=STATE.fixtures.find(x=>x.id===id);
  f.status='forfeit';
  f.score = side==='home'? {home:0,away:3} : {home:3,away:0};
  f.completedAt=new Date().toISOString();
  persist();
}
function addPause(id,side){ const f=STATE.fixtures.find(x=>x.id===id); if(f.pauses[side]<3) f.pauses[side]++; persist(); }
function toggleFlag(id,flag,val){ const f=STATE.fixtures.find(x=>x.id===id); f[flag]=val; persist(); }
function logDisconnect(id){
  const f=STATE.fixtures.find(x=>x.id===id);
  const minute=parseInt(document.getElementById(`dcMinute-${id}`).value,10);
  const teamSide=document.getElementById(`dcTeam-${id}`).value;
  if(isNaN(minute)){alert('Enter the minute of the disconnect.');return;}
  let ruling;
  if(minute<10 && !f.goalsScored && !f.redCard){ ruling='Match fully restarted (§4)'; }
  else { ruling='Continues shorthanded under AI control, unless admin authorizes a structured replay'; }
  f.disconnects.push({minute,team:teamSide,ruling});
  persist();
}
function completeMatch(id){
  const f=STATE.fixtures.find(x=>x.id===id);
  f.score.home=parseInt(document.getElementById(`scoreHome-${id}`).value,10)||0;
  f.score.away=parseInt(document.getElementById(`scoreAway-${id}`).value,10)||0;
  f.status='completed'; f.completedAt=new Date().toISOString();
  persist();
}

/* ============================= STANDINGS ============================= */
function viewStandings(){
  const table = {};
  STATE.teams.forEach(t=>table[t.id]={id:t.id,name:t.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  STATE.fixtures.filter(f=>f.status==='completed'||f.status==='forfeit').forEach(f=>{
    const h=table[f.home], a=table[f.away];
    if(!h||!a) return;
    h.p++; a.p++;
    h.gf+=f.score.home; h.ga+=f.score.away;
    a.gf+=f.score.away; a.ga+=f.score.home;
    if(f.score.home>f.score.away){ h.w++; a.l++; h.pts+=3; }
    else if(f.score.home<f.score.away){ a.w++; h.l++; a.pts+=3; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  const rows = Object.values(table).sort((a,b)=> b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);

  return `
    <div class="topbar"><div><p class="eyebrow">League Table</p><h1 class="page-title">Standings</h1>
    <p class="page-sub">Computed automatically from completed and forfeited fixtures.</p></div></div>
    <div class="card">
      <table><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>
        ${rows.length? rows.map((r,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td class="mono">${r.gf-r.ga>=0?'+':''}${r.gf-r.ga}</td><td class="mono"><strong>${r.pts}</strong></td></tr>`).join(''):'<tr class="empty-row"><td colspan="10">No teams registered.</td></tr>'}
      </tbody></table>
    </div>
  `;
}

/* ============================= SETTINGS ============================= */
function viewSettings(){
  return `
    <div class="topbar"><div><p class="eyebrow">Configuration</p><h1 class="page-title">Settings</h1></div></div>
    <div class="card">
      <div class="card-head"><h3>Tournament</h3></div>
      <div class="row">
        <div><label>Tournament Name</label><input id="setName" value="${esc(STATE.settings.tournamentName)}"></div>
        <div><label>Season / Split Label</label><input id="setSeason" value="${esc(STATE.settings.season)}"></div>
      </div>
      <div class="row">
        <div><label>Squad Cap</label><input type="number" id="setCap" value="${STATE.settings.squadCap}"></div>
        <div><label>Max Transfers per Player / Season</label><input type="number" id="setTrCap" value="${STATE.settings.transferCapPerSeason}"></div>
      </div>
      <div class="btn-row"><button onclick="saveSettings()">Save Settings</button></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Data &amp; Storage</h3></div>
      <p class="page-sub">This console currently stores its data in <strong>${PERSIST_MODE==='local'?'this browser\\'s local storage':'temporary in-memory storage (this preview session only)'}</strong>. Nothing is sent to a server. Export a backup regularly, especially before clearing browser data.</p>
      <div class="btn-row">
        <button class="secondary" onclick="exportData()">Export Backup (JSON)</button>
        <button class="secondary" onclick="document.getElementById('importFile').click()">Import Backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
        <button class="danger" onclick="resetAll()">Reset All Data</button>
      </div>
    </div>
  `;
}
function saveSettings(){
  STATE.settings.tournamentName=document.getElementById('setName').value.trim()||STATE.settings.tournamentName;
  STATE.settings.season=document.getElementById('setSeason').value.trim()||STATE.settings.season;
  STATE.settings.squadCap=parseInt(document.getElementById('setCap').value,10)||STATE.settings.squadCap;
  STATE.settings.transferCapPerSeason=parseInt(document.getElementById('setTrCap').value,10)||STATE.settings.transferCapPerSeason;
  persist();
}
function exportData(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='matchday-console-backup.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{ STATE=JSON.parse(reader.result); persist(); alert('Backup imported.'); }
    catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm('This clears every team, fixture, transfer and record. Continue?')) return;
  STATE=defaultState(); persist();
}

/* ============================= RENDER ROOT ============================= */
function render(){
  renderNav();
  const map = {
    dashboard:viewDashboard, teams:viewTeams, transfers:viewTransfers, fixtures:viewFixtures,
    live:viewLive, compliance:viewCompliance, disputes:viewDisputes, standings:viewStandings, settings:viewSettings
  };
  document.getElementById('content').innerHTML = map[ACTIVE_TAB]();
}
render();
</script>
</body>
</html>
